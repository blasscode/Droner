<!DOCTYPE html>
<!-- La línea de arriba (DOCTYPE) le avisa al navegador que este documento es HTML5 -->

<!-- <html> es la raíz del documento; lang="es" indica que el contenido está en español -->
<html lang="es">

<!-- <head> contiene información sobre la página que NO se muestra dentro de la ventana -->
<head>
    <!-- Codificación de caracteres: UTF-8 permite escribir tildes, ñ y símbolos sin que se rompan -->
    <meta charset="UTF-8">
    <!-- Hace que en celulares la página use el ancho real de la pantalla y arranque sin zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Título de la pestaña del navegador y del resultado en buscadores -->
    <title>Droner | Crear cuenta</title>
    <!-- Descripción corta que los buscadores muestran debajo del título -->
    <meta name="description" content="Creá tu cuenta en Droner, el blog para quienes quieren adentrarse en el mundo de los drones.">
    <!-- Palabras clave relacionadas con el contenido del sitio -->
    <meta name="keywords" content="drone,dji,aeromodelismo,blog,noticias,vuelo,radiocontrol,video">

    <!-- Hoja de estilos de Bootstrap 5.1.3 (copia local). Se carga también acá para que el
         encabezado y los textos se vean igual que en el resto del sitio -->
    <link rel="stylesheet" href="./vendor/bootstrap/css/bootstrap.min.css">
    <!-- Hoja de estilos propia; va DESPUÉS de Bootstrap para poder pisar sus reglas -->
    <link rel="stylesheet" href="./css/styles.css">

    <!-- Scripts propios. "defer" los ejecuta recién cuando el HTML terminó de leerse, y en este mismo orden -->
    <!-- 1) Función pedirApi para hablar con el backend; va primero porque los demás la usan -->
    <script src="./js/api.js" defer></script>
    <!-- 2) Cambia la opción "Ingresar" del menú si hay una sesión iniciada -->
    <script src="./js/sesion.js" defer></script>
    <!-- 3) Envía este formulario al backend y redirige según la respuesta -->
    <script src="./js/formularios.js" defer></script>
</head>

<!-- <body> contiene todo lo que se ve en la página -->
<body>

    <!-- ===================== ENCABEZADO (se repite igual en todas las páginas) ===================== -->
    <!-- <header>: barra superior con el logo y el menú -->
    <header class="header">
        <!-- Caja interna que centra el contenido y lo limita a 1100px de ancho -->
        <div class="header__container">
            <!-- Logo de texto; es un enlace que siempre vuelve a la página de inicio -->
            <a class="logo" href="./index.html">DRONER</a>
            <!-- <nav>: bloque de navegación; aria-label le pone nombre para los lectores de pantalla -->
            <nav class="menu" aria-label="Menú principal">
                <!-- Lista de opciones del menú principal -->
                <ul class="menu__lista">
                    <!-- Opción "Inicio" -->
                    <li class="menu__item"><a class="menu__link" href="./index.html">Inicio</a></li>
                    <!-- Opción "Marcas": contiene un submenú desplegable -->
                    <li class="menu__item">
                        <!-- Es un <button> y no un enlace porque no lleva a otra página: solo despliega el submenú -->
                        <button class="menu__link" type="button">Marcas <span class="menu__flecha" aria-hidden="true">▾</span></button>
                        <!-- Submenú: oculto por CSS, aparece al pasar el mouse o al enfocar el botón -->
                        <ul class="submenu">
                            <!-- DJI lleva al único artículo publicado de esa marca -->
                            <li><a class="menu__link" href="./mini2.html">DJI</a></li>
                            <!-- Parrot todavía no tiene página: se muestra como texto sin enlace -->
                            <li><span class="submenu__proximamente">Parrot (próximamente)</span></li>
                            <!-- Syma todavía no tiene página: se muestra como texto sin enlace -->
                            <li><span class="submenu__proximamente">Syma (próximamente)</span></li>
                        </ul> <!-- fin del submenú de marcas -->
                    </li> <!-- fin de la opción "Marcas" -->
                    <!-- Opción "Ingresar": contiene un submenú desplegable.
                         data-menu-sesion es la marca que busca js/sesion.js: si hay una sesión iniciada,
                         reemplaza este submenú por "Mi cuenta" y "Cerrar sesión" -->
                    <li class="menu__item" data-menu-sesion>
                        <!-- Botón que despliega el submenú de acceso; el <span> marcado con data-menu-sesion-texto
                             es el texto que js/sesion.js cambia por "Hola, (nombre)" -->
                        <button class="menu__link" type="button"><span data-menu-sesion-texto>Ingresar</span> <span class="menu__flecha" aria-hidden="true">▾</span></button>
                        <!-- Submenú con las dos formas de ingresar -->
                        <ul class="submenu">
                            <!-- Lleva al formulario de inicio de sesión -->
                            <li><a class="menu__link" href="./iniciar-sesion.html">Ya tengo cuenta</a></li>
                            <!-- Formulario de registro; aria-current="page" marca que es la página actual -->
                            <li><a class="menu__link" href="./registrar.html" aria-current="page">Soy nuevo</a></li>
                        </ul> <!-- fin del submenú de ingreso -->
                    </li> <!-- fin de la opción "Ingresar" -->
                    <!-- Opción "Blog": lleva al artículo del DJI Mini 2 -->
                    <li class="menu__item"><a class="menu__link" href="./mini2.html">Blog</a></li>
                </ul> <!-- fin de la lista del menú -->
            </nav> <!-- fin de la navegación -->
        </div> <!-- fin de .header__container -->
    </header> <!-- fin del encabezado -->

    <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
    <!-- <main>: contenido único de esta página; la clase login pone el degradado y centra la tarjeta -->
    <main class="login">
        <!-- Tarjeta translúcida que agrupa todo el formulario -->
        <section class="login__container">
            <!-- Título principal de la página (único <h1>); la clase h2 de Bootstrap le da un tamaño más moderado -->
            <h1 class="h2">Crear cuenta</h1>

            <!-- Formulario. data-formulario="registro" le indica a js/formularios.js que debe enviarlo a POST /api/registro.
                 method="post" evita que, si el script no cargara, la contraseña viaje visible en la URL. -->
            <form class="login__container--form" method="post" action="#" data-formulario="registro">
                <!-- Etiqueta del campo nombre: visually-hidden la oculta a la vista pero la leen los lectores de pantalla;
                     "for" la vincula con el campo cuyo id es "nombre" -->
                <label class="visually-hidden" for="nombre">Nombre</label>
                <!-- Campo de nombre: type="text" acepta cualquier texto; autocomplete="name" sugiere el nombre guardado;
                     required impide enviar el formulario con el campo vacío -->
                <input class="input" type="text" id="nombre" name="nombre" placeholder="Nombre" autocomplete="name" required>
                <!-- Etiqueta del campo correo (solo para lectores de pantalla) -->
                <label class="visually-hidden" for="correo">Correo</label>
                <!-- Campo de correo: type="email" valida el formato y muestra el teclado con @ en celulares -->
                <input class="input" type="email" id="correo" name="correo" placeholder="Correo" autocomplete="email" required>
                <!-- Etiqueta del campo contraseña (solo para lectores de pantalla) -->
                <label class="visually-hidden" for="contrasena">Contraseña</label>
                <!-- Campo de contraseña: type="password" oculta lo que se escribe;
                     autocomplete="new-password" le avisa al navegador que es una contraseña nueva (puede ofrecer generar una);
                     minlength="8" exige al menos 8 caracteres (el servidor valida lo mismo) -->
                <input class="input" type="password" id="contrasena" name="contrasena" placeholder="Contraseña (mínimo 8 caracteres)" autocomplete="new-password" minlength="8" required>
                <!-- Botón de envío: type="submit" dispara el evento submit del formulario -->
                <button class="button" type="submit">Registrarme</button>
                <!-- Párrafo vacío donde js/formularios.js escribe los errores que devuelve el servidor;
                     role="status" hace que los lectores de pantalla lo anuncien cuando cambia -->
                <p class="login__mensaje" role="status"></p>
            </form> <!-- fin del formulario -->

            <!-- Opciones de registro con redes sociales (por ahora son solo visuales, no hacen nada) -->
            <section class="login__container--social-media" aria-label="Registro con redes sociales">
                <!-- Opción Google: alt vacío porque el ícono es decorativo (el texto ya dice "Google") -->
                <div><img src="./assets/img/icono-google.png" alt="">Registrate con Google</div>
                <!-- Opción Twitter: alt vacío por el mismo motivo -->
                <div><img src="./assets/img/icono-twitter.png" alt="">Registrate con Twitter</div>
            </section> <!-- fin de las opciones sociales -->

            <!-- Texto al pie de la tarjeta con el enlace para volver al inicio de sesión -->
            <p class="login__container--register">¿Ya tenés cuenta? <a href="./iniciar-sesion.html">Iniciá sesión</a></p>
        </section> <!-- fin de la tarjeta -->
    </main> <!-- fin del contenido principal -->

    <!-- ===================== PIE DE PÁGINA (se repite igual en todas las páginas) ===================== -->
    <!-- <footer>: barra inferior con enlaces secundarios -->
    <footer class="footer">
        <!-- Vuelve a la página de inicio -->
        <a href="./index.html">Inicio</a>
        <!-- Enlace pendiente: todavía no existe la página, por eso apunta a "#" -->
        <a href="#">Términos de uso</a>
        <!-- Enlace pendiente: todavía no existe la página -->
        <a href="#">Declaración de privacidad</a>
        <!-- Enlace pendiente: todavía no existe la página -->
        <a href="#">Centro de ayuda</a>
    </footer> <!-- fin del pie de página -->

    <!-- Esta página no carga el JavaScript de Bootstrap porque no usa modal ni carrusel -->
</body>
</html>
